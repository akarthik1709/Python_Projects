name: Latest portfolio
on:
  schedule:
      # Runs at the end of every day
      - cron: '0 0 * * *'
  workflow_dispatch:

jobs:     
  job_1:
    name: update-index-with-project
    runs-on: ubuntu-latest
    steps:
        - name: PortfolioFy
          uses: kaustubhgupta/PortfolioFy@v3.2.1
          with:
            gh_token: ${{ secrets.TOKEN }},
            theme: 1,
            blogs: false,
            hackathons: false,
            resume_link: false,
            social_links: false,
