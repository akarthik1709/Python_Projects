name: Latest portfolio
on:
  schedule:
    - cron: '0 0 * * *'
    # This makes the action run at the end of every day. Customize this accordingly or you can also trigger this action for GitHub events (Pull, Push). Check the GitHub actions page for that.
  workflow_dispatch:

jobs:
  updating-portfolio:
    name: update-index-with-project
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Decode the GitHub App Private Key
        id: decode
        run: |
          private_key=$(echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d | awk 'BEGIN {ORS="\\n"} {print}' | head -c -2) &> /dev/null
          echo "::add-mask::$private_key"
          echo "private-key=$private_key" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: 1886822
          private-key: ${{ steps.decode.outputs.private-key }}
      - uses: actions/checkout@v2
      - uses: akarthik1709/PortfolioFy@main
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
